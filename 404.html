<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Signal Lost</title>
    <style>
        :root {
            --bg-dark: #000; --text-red: #f00; --text-muted: #888;
            --neon-green: #0f0;
        }
        body { 
            background: var(--bg-dark); color: var(--text-red); 
            font-family: 'Courier New', monospace; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; text-align: center; margin: 0;
        }
        h1 { 
            font-size: 4em; 
            text-shadow: 0 0 20px var(--text-red); 
            margin-bottom: 10px;
        }
        p { color: var(--text-muted); font-size: 1.2em; letter-spacing: 2px; }
        a { 
            color: var(--neon-green); text-decoration: none; 
            border: 1px solid var(--neon-green); 
            padding: 12px 24px; margin-top: 30px; 
            display: inline-block; text-transform: uppercase;
            transition: all 0.3s;
        }
        a:hover { 
            background: var(--neon-green); color: #000;
            box-shadow: 0 0 20px var(--neon-green);
        }
    </style>
</head>
<body>
    <div>
        <h1>404</h1>
        <p>СИГНАЛ ПОТЕРЯН. СТРАНИЦА НЕ СУЩЕСТВУЕТ.</p>
        <a href="/">ВЕРНУТЬСЯ В СЕТЬ</a>
    </div>
</body>
</html>
