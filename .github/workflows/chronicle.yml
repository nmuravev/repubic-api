name: RedCat Chronicle

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chronicle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python validate_supabase.py

      - name: Run chronicler and update STATE.md
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_URL: https://redcatpromo.ru
          ORCHESTRATOR_ACTION: chronicle
        run: python orchestrator.py

      - name: Commit STATE.md and memory export
        run: |
          git config user.name "RedCat Republic Bot"
          git config user.email "bot@users.noreply.github.com"
          git add STATE.md memory/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update republic state and cat memory [skip ci]"
            git push
          fi

      - name: Sync STATE.md to gh-pages
        run: |
          git config user.name "RedCat Republic Bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages branch not found — skip STATE sync"
            exit 0
          fi
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout origin/main -- STATE.md
          git add STATE.md
          if git diff --staged --quiet; then
            echo "STATE.md unchanged on gh-pages"
          else
            git commit -m "Sync STATE.md from chronicle [skip ci]"
            git push origin gh-pages
          fi
