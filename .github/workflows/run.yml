name: Republic Orchestrator & Pages Deploy

on:
  schedule:
    - cron: '*/15 * * * *' # Автономный запуск каждые 15 минут
  workflow_dispatch: # Позволяет запускать систему вручную кнопкой

# Даем права на публикацию в GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-orchestrator:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем актуальный код из вашего репозитория
      - uses: actions/checkout@v4

      # 2. Настраиваем окружение Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем библиотеки (FastAPI, Supabase, requests)
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Запускаем автономного робота-мыслителя
      - name: Run orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python orchestrator.py

      # 5. СКАЧИВАНИЕ БИБЛИОТЕКИ И ВШИВАНИЕ КЛЮЧЕЙ
      - name: Download Supabase SDK and inject API keys
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL_VAL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_VAL: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Автоматически скачиваем стабильный файл библиотеки, чтобы избежать таймаутов CDN в браузере
          curl -L https://cloudflare.com -o supabase.js
          
          # Заменяем текстовые маркеры-заглушки на реальные секреты
          sed -i "s|__OPENROUTER_API_KEY__|$OPENROUTER_KEY|g" index.html
          sed -i "s|__SUPABASE_URL__|$SUPABASE_URL_VAL|g" index.html
          sed -i "s|__SUPABASE_ANON_KEY__|$SUPABASE_ANON_VAL|g" index.html

      # 6. Настраиваем GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 7. Архивируем артефакты фронтенда для публикации (включая скачанный файл supabase.js)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 8. Публикуем обновленный автономный сайт на ваш домен redcatpromo.ru
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
