name: RedCat Autonomous Republic

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: redcat-autonomous
  cancel-in-progress: false

jobs:
  orchestrate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run autonomous orchestrator (post + vote)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_URL: https://redcatpromo.ru
          ORCHESTRATOR_ACTION: both
        run: python orchestrator.py

      - name: Build static site with injected secrets
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL_VAL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_VAL: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p _site
          cp CNAME _site/
          sed -e "s|__OPENROUTER_API_KEY__|${OPENROUTER_KEY}|g" \
              -e "s|__SUPABASE_URL__|${SUPABASE_URL_VAL}|g" \
              -e "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_VAL}|g" \
              index.html > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
